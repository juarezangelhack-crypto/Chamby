<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17324d">
  <meta name="description" content="Elige tu camino para encontrar oportunidades en Chambly.">
  <title>Chambly | Elige tu camino</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="landing-page">
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="Chambly, inicio">
        <img class="brand-image" src="assets/chambly-wordmark.png" alt="Chambly">
      </a>
      <button class="account-button" type="button" id="account-button">Entrar</button>
    </div>
  </header>

  <main id="contenido" class="welcome-page">
    <div class="container welcome-content">
      <p class="kicker">Oportunidades en Lima</p>
      <h1>¡Bienvenido!</h1>
      <p class="welcome-question">¿Qué empleo quieres encontrar hoy?</p>
      <div class="work-choice-grid">
        <a class="work-choice" href="trabajorapido.html">
          <span class="choice-title">Trabajo<br>rápido</span>
          <img class="choice-illustration no-profile-icon" src="assets/no-profile.svg" alt="">
          <span class="choice-caption">Gana dinero con tus<br>habilidades</span>
        </a>
        <a class="work-choice" href="trabajoformal.html">
          <span class="choice-title">Trabajo<br>formal</span>
          <img class="choice-illustration no-profile-icon" src="assets/no-profile.svg" alt="">
          <span class="choice-caption">Construye<br>experiencia laboral</span>
        </a>
      </div>
    </div>
  </main>

  <dialog id="account-dialog" aria-labelledby="account-dialog-title">
    <button class="dialog-close" type="button" data-close-dialog aria-label="Cerrar">×</button>
    <div id="account-content"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="landing.js"></script>
</body>
</html>
